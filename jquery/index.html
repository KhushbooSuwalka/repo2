    <script>
        $(document).ready(function () {
            $("#MyRegister").submit(function (e) {
                var full_name = $("#full_name").val();
                var email = $("#email").val();
                var contact_no = $("#contact_no").val();
                var password = $("#password").val();

                $(".error").remove();

                var hasError = false;

                if (!full_name) {
                    alert('Empty full name Error');
                    hasError = true;
                }
                if (!email ) {
                    alert('Empty email Error');
                    hasError = true;
                }
                if (!contact_no ) {
                    alert('Empty contact number Error');
                    hasError = true;
                }
                if (!password ) {
                    alert('Empty password Error');
                    hasError = true;
                }
                if (hasError) {
                    e.preventDefault(); // Prevent form submission if there are errors
                }

            });
        });



    </script>

    <div class="container mt-5 border">
        <h1 class="text-danger text-center mt-5">Register form</h1>
        <form id="MyRegister">
            <div class="mb-5 mt-5">
                <label class="text-primary">Full Name</label>
                <input type="text" placeholder="Enter full Name" class="form-control" id="full_name">
                <label class="text-primary mt-3">Email</label>
                <input type="email" placeholder="Enter email" class="form-control" id="email">
                <label class="text-primary mt-3">Contact</label>
                <input type="text" placeholder="+91 0000000000" class="form-control" id="contact_no">
                <label class="text-primary mt-3">Password</label>
                <input type="password" placeholder="Enter password" class="form-control">
                <label class="text-primary mt-3">Confirm the password</label>
                <input type="password" placeholder="Confirm password" class="form-control" id="password">
                <button type="submit" class="form-control bg-success mt-3 text-center text-white ">Submit</button>
            </div>

        </form>
    </div>
