        function StudentDetails() {
            let student_rollno = document.getElementById('student_rollno').value;
            
            let student_name = '';
            let student_class='';
            switch (student_rollno) {
                case '101':
                    student_name = 'John ';
                    student_class= '10';
                    break;
                case '102':
                    student_name= ' Khushi';
                    student_class='11';
                    break;
            }
            if(!student_rollno){
                document.getElementById('roll_error').innerHTML = "Please enter roll no.";
                return false;
            }else{
                document.getElementById('roll_error').innerHTML = "";
                document.getElementById('demo').innerHTML = student_name +" of "+ student_class;
                return true;
            }
            
        }
