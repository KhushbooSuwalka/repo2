    <div class="container mt-5 p-5 border">
        <h4 class="text-center">Tours & Holidays Customer Form </h4>
        <form id="'myform" onsubmit="return TourHoliday()" action="#">
            <div class="mt-5">
                <label>Package Name</label>
                <select class="form-control" id="package_name">
                    <option value="Select Package">Select Package</option>
                    <option value="Alwar">Alwar</option>
                    <option value="Jaipur">Jaipur</option>
                </select>
                <p class="text-danger" id="package_error"></p>
            </div>
            <div class="mb-5 input-group">
                <span class="input-group-text bg-warning">Child Details</span>
                <input type="text" class="form-control" id="no_child" placeholder="No Child">
                <input type="text" class="form-control" id="amount_each_child" placeholder="Amount" id="Amount">
                <p class="text-danger" id="no_child_error"></p>
                <p class="text-danger" id="child_amount_error"></p>
            </div>
            <div class="mb-5 input-group">
                <span class="input-group-text bg-info">No.Packs</span>
                <input type="text" class="form-control" id="pax_no" placeholder="No. Packs">
                <input type="text" class="form-control" id="pax_amount" placeholder="Amount(00.00)">
                <p class="text-danger" id="pax_no_error"></p>
                <p class="text-danger" id="pax_amount_error"></p>
            </div>
            <div class="mb-5">
                <label>Days</label>
                <select class=" form-control" id="days">
                    <option value="">No of days</option>
                    <option value="1">Day 1</option>
                    <option value="4">Day 4</option>
                    <option value="6">Day 6</option>
                    <option value="10">Day 10</option>
                </select>
                <p class="text-danger" id="days_error"></p>
            </div>
            <button type="submit" class="btn btn-success container w=100" onclick="return TourHoliday(event)">Get
                Details</button>
        </form>
        <div class="mt-5">
            <h3>Total Child Amount:<span id="no_child_total"></span></h3>
            <h3>Total Packs:<span id="pax_no_total"></span></h3>
            <h3>Grand Total:<span id="total_amount"></span></h3>
            <h3 id="thanks" class="bg-primary text-center text-white h-120"></h3>

        </div>
    </div>
